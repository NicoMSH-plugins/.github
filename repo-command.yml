# Mindestlänge für Issue- und Pull-Request-Beschreibungen (in Zeichen)
minBodyLength: 50

# Verfügbare Slash-Commands in Kommentaren (/wip, /close, /label usw.)
commands:
    wip: true
    approve: true
    close: true
    label: true
    merge: true
    requestInfo: true

# Automatische Aktionen bei neuen Issues, PRs und Reviews
automations:
    addReadyForReview: true
    addApprovedLabel: true
    addChangesRequestedLabel: true
    addMergedLabel: true
    requestMoreInfo: true
    addLabelsOnClose: true
    welcomeContributor: true
    welcomeIssue: true

# Labels (englische Standard-Bezeichnungen bleiben kompatibel für alle GitHub-Nutzer)
labels:
    wip: "work in progress"
    readyForReview: "ready for review"
    approved: "approved"
    changesRequested: "changes requested"
    needsMoreInfo: "needs more info"
    merged: "merged"
    bug: "bug"
    feature: "feature"
    enhancement: "enhancement"
    fixed: "fixed"
    implemented: "implemented"

# Zweisprachige Bot-Antworten (Deutsch & Englisch)
messages:
    welcomeContributor: |
        Danke für deinen ersten Pull Request, @{user}! 🎉
        Ich schaue mir deine Änderungen in Kürze an.

        ---
        *Thanks for your first pull request, @{user}! I will review your changes soon.*
    welcomeIssue: |
        Danke für dein erstes Issue, @{user}! 🎉
        Bitte stelle sicher, dass du deine verwendete Version (KeyHelp / Owncast) und ggf. relevante Logs angegeben hast.

        ---
        *Thanks for opening your first issue, @{user}! Please make sure you included your version (KeyHelp / Owncast) and any relevant logs.*
    requestMoreInfo: |
        Hallo @{user}! Deine Beschreibung ist noch etwas kurz – bitte ergänze weitere Details (z. B. Schritte zum Nachstellen, Version oder Fehlermeldungen) in deinem {type}.

        ---
        *Hey @{user}! Please provide more details (e.g. steps to reproduce, version, or error logs) in your {type}.*
    moreInfoAdded: |
        Danke @{user} für das Ergänzen der Informationen! Das Label wurde automatisch aktualisiert.

        ---
        *Thanks @{user} for adding more information! The label has been updated automatically.*
